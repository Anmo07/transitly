$kind: http-request
method: POST
url: '{{baseUrl}}/shipments/:id/close'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: shipment_id_here
body:
  type: json
  content: |-
    {
      "reason": "delivered"
    }
