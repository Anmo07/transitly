$kind: http-request
method: POST
url: '{{baseUrl}}/orders/:id/verify-otp'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: order_id_here
body:
  type: json
  content: |-
    {
      "otp": "123456"
    }
