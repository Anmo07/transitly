$kind: http-request
method: POST
url: '{{baseUrl}}/riders/payout'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 500,
      "method": "upi",
      "upiId": "rider@upi"
    }
