[build]
  command = "npm run build:css:min && npm run build:react"
  publish = "public"

# Enable Pretty URLs
[processing]
  skip_processing = false

[processing.html]
  pretty_urls = true

# Cache hashed Vite assets for 1 year (immutable)
[[headers]]
  for = "/dist/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache 3D scrubbers and frame sequences for 1 year
[[headers]]
  for = "/assets/3d/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static assets (favicon, images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Static stylesheets and scripts
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://maps.googleapis.com https://*.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://lh3.googleusercontent.com https://upload.wikimedia.org https://*.amazonaws.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://server.arcgisonline.com; connect-src 'self' https://transitly-api.onrender.com https://*.google.com https://*.googleapis.com https://api.bigdatacloud.net https://nominatim.openstreetmap.org ws: wss:; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self';"
