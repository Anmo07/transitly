[build]
  command = "npm run build:css:min"
  publish = "public"

# Enable Pretty URLs (maps /login to /login.html automatically)
[processing]
  skip_processing = false

[processing.html]
  pretty_urls = true

# Production API Proxy to Render Backend
[[redirects]]
  from = "/api/*"
  to = "https://transitly-api.onrender.com/api/:splat"
  status = 200
  force = true
