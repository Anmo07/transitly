<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Transitly - Payment Methods</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/></noscript>

  <!-- Production Compiled Tailwind CSS & Dedicated Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/payment-methods.css" />
</head>
<body class="bg-[#FAF8FF] text-[#191B24] font-sans min-h-screen pt-14 pb-20 antialiased selection:bg-[#DAE1FF] selection:text-[#001849]">

  <!-- TopAppBar Header Component (Exact Match to Image) -->
  <header class="fixed top-0 left-0 right-0 w-full z-50 bg-[#FAF8FF] flex items-center px-5 h-16 transition-all border-b border-outline-variant/10">
    <a href="/profile" aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm text-[#191B24] hover:bg-gray-50 transition-colors active:scale-95">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </a>
    <h1 class="text-lg font-bold text-[#191B24] flex-1 text-center pr-10">Payment Methods</h1>
  </header>

  <!-- Main Content Canvas (Exact Match to Image) -->
  <main class="w-full max-w-md mx-auto px-5 py-4 flex flex-col gap-6">
    <!-- Saved Cards Section -->
    <section class="flex flex-col gap-3">
      <h2 class="text-xs font-bold text-[#727687] uppercase tracking-wider px-1">SAVED CARDS</h2>
      <div class="flex flex-col gap-3">
        <!-- Card 1: Visa (Default Active - Exact Match to Image) -->
        <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border-2 border-[#0066FF] cursor-pointer relative overflow-hidden transition-all">
          <div class="flex items-center gap-3.5 relative z-10">
            <div class="w-12 h-8 bg-[#1A1F36] rounded-md flex items-center justify-center shrink-0 shadow-sm">
              <span class="text-white font-black text-xs italic tracking-tighter">VISA</span>
            </div>
            <div class="flex flex-col">
              <span class="text-sm font-bold text-[#191B24]">•••• 4242</span>
              <span class="text-xs text-[#727687]">Expires 12/25</span>
            </div>
          </div>
          <div class="flex items-center gap-2.5 relative z-10">
            <span class="px-2.5 py-0.5 bg-[#DAE1FF] text-[#0050CB] text-[11px] font-bold rounded-full">Default</span>
            <span class="material-symbols-outlined text-[#0066FF] fill text-[20px]">check_circle</span>
          </div>
        </div>

        <!-- Card 2: Mastercard (Exact Match to Image) -->
        <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-outline-variant/10 cursor-pointer hover:border-gray-300 transition-all">
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-8 bg-[#EB001B] relative rounded-md overflow-hidden shrink-0 shadow-sm">
              <div class="absolute w-5 h-5 rounded-full bg-[#F79E1B] mix-blend-screen right-1 top-1.5"></div>
              <div class="absolute w-5 h-5 rounded-full bg-[#EB001B] left-1 top-1.5 z-10"></div>
            </div>
            <div class="flex flex-col">
              <span class="text-sm font-bold text-[#191B24]">•••• 8831</span>
              <span class="text-xs text-[#727687]">Expires 08/24</span>
            </div>
          </div>
          <button aria-label="More options" class="w-8 h-8 flex items-center justify-center rounded-full text-[#727687] hover:bg-gray-100 transition-colors" onclick="alert('Card Options')">
            <span class="material-symbols-outlined text-[20px]">more_vert</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Digital Wallets Section (Exact Match to Image) -->
    <section class="flex flex-col gap-3">
      <h2 class="text-xs font-bold text-[#727687] uppercase tracking-wider px-1">DIGITAL WALLETS</h2>
      <div class="grid grid-cols-2 gap-3.5">
        <!-- Apple Pay -->
        <div class="bg-white rounded-2xl p-5 flex flex-col items-center justify-center gap-2.5 cursor-pointer shadow-sm border border-outline-variant/10 hover:border-[#0066FF]/30 transition-all" onclick="alert('Apple Pay Selected')">
          <div class="w-12 h-12 bg-black rounded-full flex items-center justify-center text-white shadow-sm">
            <span class="material-symbols-outlined fill text-[22px]">file_download</span>
          </div>
          <span class="text-xs font-bold text-[#191B24]">Apple Pay</span>
        </div>

        <!-- UPI -->
        <div class="bg-white rounded-2xl p-5 flex flex-col items-center justify-center gap-2.5 cursor-pointer shadow-sm border border-outline-variant/10 hover:border-[#0066FF]/30 transition-all" onclick="alert('UPI Selected')">
          <div class="w-12 h-12 bg-white border border-[#E1E2EE] rounded-full flex items-center justify-center shadow-sm">
            <div class="flex items-center justify-center gap-1">
              <div class="w-2.5 h-2.5 rounded-full bg-[#EA580C]"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-[#16A34A]"></div>
            </div>
          </div>
          <span class="text-xs font-bold text-[#191B24]">UPI</span>
        </div>
      </div>
    </section>

    <!-- Dashed Add Payment Method Outline (Exact Match to Image) -->
    <div class="mt-auto pt-6">
      <button class="w-full h-14 bg-transparent border-2 border-dashed border-[#C2C6D8] rounded-2xl flex items-center justify-center gap-2 text-[#0066FF] text-sm font-bold hover:bg-white hover:border-[#0066FF] transition-all" onclick="alert('Add Payment Method')">
        <span class="material-symbols-outlined">add</span>
        Add Payment Method
      </button>
    </div>
  </main>

  <!-- Modular Scripts -->
  <script defer src="/js/common.js"></script>
  <script defer src="/js/payment-methods.js"></script>
</body>
</html>
