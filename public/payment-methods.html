<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Transitly - Payment Methods</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/></noscript>

  <!-- Production Compiled Tailwind CSS & Dedicated Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/payment-methods.css" />
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative antialiased">

  <!-- TopAppBar Header Component (Stitch Spec) -->
  <header class="flex justify-between items-center px-container-margin w-full h-16 bg-background sticky top-0 z-40 border-b border-outline-variant/20">
    <a href="/profile" aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest shadow-sm text-on-surface hover:bg-surface-container-low transition-colors">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="text-headline-md font-headline-md font-bold text-on-surface">Payment Methods</h1>
    <div class="w-10 h-10"></div>
  </header>

  <!-- Main Content Canvas (Stitch Spec) -->
  <main class="flex-1 px-container-margin py-stack-lg flex flex-col gap-section-gap pb-32 max-w-2xl mx-auto w-full">
    <!-- Saved Cards Section -->
    <section class="flex flex-col gap-stack-md">
      <h2 class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Saved Cards</h2>
      <div class="flex flex-col gap-stack-md">
        <!-- Primary Card (Active - Stitch Spec) -->
        <div class="glass-card active-card rounded-xl p-4 flex items-center justify-between cursor-pointer relative overflow-hidden transition-all duration-200 payment-card-item">
          <div class="flex items-center gap-4 relative z-10">
            <div class="w-12 h-8 bg-[#1A1F36] rounded flex items-center justify-center shrink-0">
              <span class="text-white font-bold text-xs italic tracking-tighter">VISA</span>
            </div>
            <div class="flex flex-col">
              <span class="text-body-md font-body-md text-on-surface font-semibold">•••• 4242</span>
              <span class="text-label-sm font-label-sm text-outline">Expires 12/25</span>
            </div>
          </div>
          <div class="flex items-center gap-3 relative z-10">
            <span class="px-2 py-1 bg-primary-fixed text-primary font-label-sm text-label-sm rounded-full">Default</span>
            <span class="material-symbols-outlined text-primary fill text-[18px]">check_circle</span>
          </div>
          <!-- Subtle ambient glow for active state -->
          <div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent pointer-events-none"></div>
        </div>

        <!-- Secondary Card (Stitch Spec) -->
        <div class="glass-card rounded-xl p-4 flex items-center justify-between cursor-pointer border border-transparent hover:border-outline-variant transition-all duration-200 payment-card-item">
          <div class="flex items-center gap-4">
            <div class="w-12 h-8 bg-[#EB001B] relative rounded overflow-hidden shrink-0">
              <div class="absolute w-5 h-5 rounded-full bg-[#F79E1B] mix-blend-screen right-1 top-1.5"></div>
              <div class="absolute w-5 h-5 rounded-full bg-[#EB001B] left-1 top-1.5 z-10"></div>
            </div>
            <div class="flex flex-col">
              <span class="text-body-md font-body-md text-on-surface font-semibold">•••• 8831</span>
              <span class="text-label-sm font-label-sm text-outline">Expires 08/24</span>
            </div>
          </div>
          <button aria-label="More options" class="w-8 h-8 flex items-center justify-center rounded-full text-outline hover:bg-surface-variant transition-colors" onclick="alert('Card Options')">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Digital Wallets Section (Stitch Spec) -->
    <section class="flex flex-col gap-stack-md">
      <h2 class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Digital Wallets</h2>
      <div class="grid grid-cols-2 gap-gutter">
        <!-- Apple Pay -->
        <div class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border border-transparent hover:border-outline-variant" onclick="alert('Apple Pay Selected')">
          <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white mb-1">
            <span class="material-symbols-outlined fill">file_download</span>
          </div>
          <span class="text-label-md font-label-md text-on-surface font-semibold">Apple Pay</span>
        </div>
        <!-- UPI -->
        <div class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border border-transparent hover:border-outline-variant" onclick="alert('UPI Selected')">
          <div class="w-10 h-10 bg-white border border-outline-variant rounded-full flex items-center justify-center mb-1">
            <div class="flex items-center justify-center gap-0.5">
              <div class="w-2 h-2 rounded-full bg-orange-500"></div>
              <div class="w-2 h-2 rounded-full bg-green-500"></div>
            </div>
          </div>
          <span class="text-label-md font-label-md text-on-surface font-semibold">UPI</span>
        </div>
      </div>
    </section>

    <!-- Add New Method CTA (Stitch Spec) -->
    <div class="mt-auto pt-section-gap">
      <button id="btnAddNewPaymentMethod" class="w-full h-14 bg-surface-container-lowest border-2 border-dashed border-outline-variant rounded-xl flex items-center justify-center gap-2 text-primary font-label-md text-label-md hover:bg-surface-container-low hover:border-primary transition-all duration-200 font-semibold" onclick="alert('Add Payment Method')">
        <span class="material-symbols-outlined">add</span>
        Add Payment Method
      </button>
    </div>
  </main>

  <!-- Modular Scripts -->
  <script defer src="/js/common.js"></script>
  <script defer src="/js/payment-methods.js"></script>
</body>
</html>
