<!DOCTYPE html>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col pt-14 pb-16 antialiased">
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex justify-between items-center px-container-margin h-14 transition-all">
<a href="/" aria-label="Menu" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2 text-primary">
<span class="material-symbols-outlined text-[24px]" data-icon="local_shipping">local_shipping</span>
</a>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Transitly</h1>
<a href="/notifications" aria-label="Notifications" class="header-notification-btn relative hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -mr-2 text-primary">
<span class="material-symbols-outlined text-[24px]" data-icon="notifications">notifications</span>
</a>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin py-stack-lg max-w-md mx-auto w-full flex flex-col gap-stack-lg">
<!-- Profile Header (Glassmorphism Bento Box) -->
<section class="glass-card rounded-[24px] p-stack-lg flex flex-col items-center justify-center text-center shadow-[0px_8px_30px_rgba(0,102,255,0.04)] relative overflow-hidden">
<!-- Decorative Background Blob -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-fixed rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-surface-tint rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>

<!-- Interactive Profile Avatar with Upload Badge -->
<div class="relative mb-2 z-10 flex flex-col items-center">
  <!-- Native Hidden File Input for Main Profile -->
  <input type="file" id="inputAvatarFile" accept="image/*" style="display:none;" />

  <label for="inputAvatarFile" class="w-24 h-24 rounded-full shadow-[0px_4px_20px_rgba(0,0,0,0.08)] border-4 border-surface overflow-hidden bg-surface-container-high relative cursor-pointer hover:ring-4 hover:ring-primary/30 transition-all block group" id="avatarClickContainer" title="Click to upload profile picture from device">
    <img id="profileAvatarImg" class="w-full h-full object-cover" data-alt="User profile photo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzAACyzyleKmM4JQVt8Aa-jr70QVcpj9loY9wKp5o9O4E4p6Pw4_DrVmOHt4kkJfjfzprBQFcotrP67UIXwwodZ_N8y_NQMBXmYt1FUgmWEZU3RkLHv9mtX5_jewodrd3AC22FofPIl1pDv6bTKcqN63TR8-Ce6clfaRjIaxwp6CeKnOIoGAZdfBFJX_YfrWG4DCAk26zr7uiOS6j2JNkj4E16URTfm8orQCRZ5X_7hBMsGpV5UeKJ"/>
    <!-- Hover Overlay -->
    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white">
      <span class="material-symbols-outlined text-2xl">add_a_photo</span>
      <span class="text-[10px] font-bold mt-0.5">Upload</span>
    </div>
  </label>
  
  <!-- Floating Camera Label Button -->
  <label for="inputAvatarFile" id="btnUploadAvatar" class="absolute bottom-7 right-[calc(50%-46px)] w-8 h-8 rounded-full bg-primary text-on-primary shadow-lg border-2 border-surface flex items-center justify-center hover:bg-primary-container active:scale-90 transition-all cursor-pointer" title="Pick Image from Device">
    <span class="material-symbols-outlined text-[16px]">photo_camera</span>
  </label>
  
  <!-- Explicit Device Pick Label Button -->
  <label for="inputAvatarFile" id="btnPickPhotoDevice" class="mt-2 text-xs font-bold text-primary flex items-center gap-1.5 px-3 py-1 bg-primary-fixed/40 hover:bg-primary-fixed/70 rounded-full transition-all active:scale-95 cursor-pointer">
    <span class="material-symbols-outlined text-[15px]">add_photo_alternate</span>
    <span data-i18n="profile_upload_device">Upload from Device</span>
  </label>
</div>

<h2 id="profileUserName" class="font-headline-md text-headline-md text-on-surface z-10 font-bold">Your Name</h2>
<p id="profileUserEmail" class="font-body-md text-body-md text-on-surface-variant mb-2 z-10">abc@example.com</p>
<p id="profileUserPhone" class="text-xs text-outline mb-stack-md z-10 font-semibold">+91 1234567890</p>

<div class="flex items-center gap-2 z-10">
  <div class="flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-full shadow-sm">
    <span class="material-symbols-outlined fill text-[#F59E0B] text-[16px]">star</span>
    <span class="font-label-md text-label-md text-on-surface">4.9</span>
    <span id="profileTripsCount" class="font-label-sm text-label-sm text-outline ml-1">(124 parcels)</span>
  </div>
  <button type="button" id="btnOpenEditProfileModal" class="flex items-center gap-1 bg-primary text-on-primary px-3 py-1.5 rounded-full text-xs font-bold shadow-sm hover:bg-primary-container active:scale-95 transition-all">
    <span class="material-symbols-outlined text-[14px]">edit</span>
    <span data-i18n="profile_edit_btn">Edit Profile</span>
  </button>
</div>
</section>

<!-- Menu Options (Bento List) -->
<section class="flex flex-col gap-stack-sm">
<button onclick="window.location.href='/saved-addresses'" class="w-full bg-surface rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform group hover:bg-surface-container-lowest">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold" data-i18n="profile_saved_addresses">Saved Addresses</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button onclick="window.location.href='/payment-methods'" class="w-full bg-surface rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform group hover:bg-surface-container-lowest">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="payment">payment</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold" data-i18n="profile_payment_methods">Payment Methods</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button onclick="window.location.href='/help-support'" class="w-full bg-surface rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform group hover:bg-surface-container-lowest">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold" data-i18n="profile_help_support">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button onclick="window.location.href='/admin'" class="w-full bg-surface rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform group hover:bg-surface-container-lowest border border-primary/20">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
</div>
<div>
<span class="font-label-md text-label-md text-primary font-bold">Command Center</span>
<p class="text-[11px] text-on-surface-variant">Admin & Fleet Operations</p>
</div>
</div>
<span class="material-symbols-outlined text-primary group-hover:translate-x-0.5 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<button onclick="window.location.href='/settings'" class="w-full bg-surface rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform group hover:bg-surface-container-lowest">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold" data-i18n="profile_settings">Settings</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</section>

<!-- Logout Action -->
<div class="mt-auto pt-section-gap pb-4 w-full">
<button type="button" id="btnLogoutProfile" class="w-full h-[56px] rounded-[16px] bg-[#F1F5F9] text-primary font-label-md text-label-md font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-sm hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[20px]" data-icon="logout">logout</span>
<span data-i18n="profile_logout">Log Out</span>
</button>
</div>
</main>

<!-- Edit Profile Modal -->
<div id="editProfileModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-surface rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-outline-variant/30 animate-slide-up max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center pb-3 border-b border-outline-variant/20 mb-4">
      <h3 class="font-bold text-base text-on-surface">Edit Profile</h3>
      <button type="button" id="btnCloseEditProfileModal" class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <!-- Modal Avatar Change Area -->
    <div id="modalDropZone" class="p-3.5 bg-surface-container-low rounded-2xl mb-4 border border-outline-variant/30 flex items-center justify-between gap-3">
      <input type="file" id="inputModalAvatarFile" accept="image/*" style="display:none;" />
      
      <div class="flex items-center gap-3">
        <label for="inputModalAvatarFile" class="w-14 h-14 rounded-full overflow-hidden border-2 border-primary shadow-md shrink-0 bg-white relative group/modalAvatar cursor-pointer block" id="modalAvatarClickArea" title="Click to change photo">
          <img id="editModalAvatarPreview" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzAACyzyleKmM4JQVt8Aa-jr70QVcpj9loY9wKp5o9O4E4p6Pw4_DrVmOHt4kkJfjfzprBQFcotrP67UIXwwodZ_N8y_NQMBXmYt1FUgmWEZU3RkLHv9mtX5_jewodrd3AC22FofPIl1pDv6bTKcqN63TR8-Ce6clfaRjIaxwp6CeKnOIoGAZdfBFJX_YfrWG4DCAk26zr7uiOS6j2JNkj4E16URTfm8orQCRZ5X_7hBMsGpV5UeKJ" alt="Avatar preview">
          <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/modalAvatar:opacity-100 flex items-center justify-center text-white transition-opacity">
            <span class="material-symbols-outlined text-base">photo_camera</span>
          </div>
        </label>
        <div class="flex flex-col">
          <span class="text-xs font-bold text-on-surface">Profile Picture</span>
          <span class="text-[10px] text-outline">JPG, PNG, WebP from device</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <label for="inputModalAvatarFile" id="btnModalUploadPhoto" class="px-3 py-1.5 bg-primary text-on-primary rounded-xl text-xs font-bold shadow-sm hover:bg-primary-container active:scale-95 transition-all flex items-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-[15px]">file_upload</span>
          <span>Browse</span>
        </label>
        <button type="button" id="btnRemoveAvatar" class="p-1.5 bg-surface hover:bg-red-50 text-red-500 rounded-xl text-xs font-bold border border-red-200 active:scale-95 transition-all" title="Remove custom photo">
          <span class="material-symbols-outlined text-[15px]">delete</span>
        </button>
      </div>
    </div>

    <form id="formEditProfile" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-on-surface block mb-1">Full Name</label>
        <input type="text" id="inputProfileName" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface outline-none focus:ring-1 focus:ring-primary" required>
      </div>

      <div>
        <label class="font-bold text-on-surface block mb-1">Email Address</label>
        <input type="email" id="inputProfileEmail" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface outline-none focus:ring-1 focus:ring-primary" required>
      </div>

      <div>
        <label class="font-bold text-on-surface block mb-1">Phone Number</label>
        <input type="text" id="inputProfilePhone" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface outline-none focus:ring-1 focus:ring-primary" required>
      </div>

      <div class="pt-3 flex gap-2">
        <button type="button" id="btnCancelEditProfile" class="w-1/2 py-2.5 rounded-xl border border-outline-variant/50 font-bold hover:bg-surface-variant">Cancel</button>
        <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md hover:bg-primary-container active:scale-95 transition-all">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Profile Toast -->
<div id="profileToast" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-on-surface text-surface px-4 py-2.5 rounded-full text-xs font-bold shadow-2xl animate-fade-in flex items-center gap-2">
  <span class="material-symbols-outlined text-sm text-emerald-400">check_circle</span>
  <span id="profileToastText">Profile updated</span>
</div>

<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-base pb-safe h-16 bg-surface border-t border-outline-variant/20 rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="local_shipping">local_shipping</span>
<span class="font-label-sm text-label-sm" data-i18n="nav_deliver">Deliver</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/tracking">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="distance">distance</span>
<span class="font-label-sm text-label-sm" data-i18n="nav_tracking">Tracking</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/history">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="history">history</span>
<span class="font-label-sm text-label-sm" data-i18n="nav_history">History</span>
</a>
<!-- Active State for Profile -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 group" href="/profile">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px] fill" data-icon="person">person</span>
<span class="font-label-sm text-label-sm" data-i18n="nav_profile">Profile</span>
</a>
</nav>

<!-- Scripts -->
<script src="/js/i18n.js?v=20260824_v2"></script>
<script defer src="/js/common.js?v=20260824_v2"></script>
<script defer src="/js/profile.js?v=20260824_v2"></script>
</body></html>
