<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Saved Addresses - Transitly</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e1e2ee",
                        "surface": "#faf8ff",
                        "surface-bright": "#faf8ff",
                        "outline-variant": "#c2c6d8",
                        "surface-dim": "#d8d9e6",
                        "inverse-surface": "#2e303a",
                        "tertiary-container": "#cc4204",
                        "surface-tint": "#0054d6",
                        "primary-container": "#0066ff",
                        "on-primary-fixed-variant": "#003fa4",
                        "secondary-fixed-dim": "#c4c7c9",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "outline": "#727687",
                        "surface-container-high": "#e6e7f4",
                        "on-tertiary-fixed": "#390c00",
                        "on-surface-variant": "#424656",
                        "on-primary-container": "#f8f7ff",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "on-background": "#191b24",
                        "inverse-on-surface": "#eff0fd",
                        "on-secondary-container": "#626567",
                        "on-surface": "#191b24",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#ecedfa",
                        "on-tertiary-fixed-variant": "#832600",
                        "primary-fixed": "#dae1ff",
                        "on-secondary-fixed-variant": "#444749",
                        "error": "#ba1a1a",
                        "primary": "#0050cb",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#b3c5ff",
                        "inverse-primary": "#b3c5ff",
                        "secondary-fixed": "#e0e3e5",
                        "surface-container-low": "#f2f3ff",
                        "tertiary-fixed": "#ffdbd0",
                        "tertiary-fixed-dim": "#ffb59d",
                        "surface-variant": "#e1e2ee",
                        "background": "#faf8ff",
                        "on-primary-fixed": "#001849",
                        "on-tertiary-container": "#fff6f4",
                        "tertiary": "#a33200",
                        "secondary": "#5c5f61",
                        "secondary-container": "#e0e3e5"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "base": "8px",
                        "stack-sm": "4px",
                        "container-margin": "20px",
                        "section-gap": "40px",
                        "stack-md": "12px",
                        "stack-lg": "24px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "label-sm": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
                        "display": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Level 1 Shadow for Cards */
        .shadow-level-1 {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        /* Level 2 Shadow for Floating Elements */
        .shadow-level-2 {
            box-shadow: 0px 8px 30px rgba(0, 102, 255, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<body class="bg-background text-on-background min-h-screen pb-36">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-surface text-primary dark:text-primary-fixed-dim docked full-width top-0 bg-background dark:bg-on-surface flat no shadows flex justify-between items-center px-container-margin w-full h-16 sticky z-40">
<button onclick="window.location.href='/profile'" aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-inverse-surface active:scale-95 transition-transform duration-150 text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 transform -translate-x-1/2">
            Saved Addresses
        </h1>
<div class="w-10 h-10"></div> <!-- Placeholder to balance flex-between -->
</header>
<!-- Main Content Canvas -->
<main class="px-container-margin pt-stack-lg max-w-2xl mx-auto flex flex-col gap-stack-lg">
<!-- Addresses List Container (Populated via Backend API) -->
<div id="addressesContainer" class="flex flex-col gap-stack-md">
  <!-- Loading Skeleton / Seed Data -->
  <div class="text-center py-6 text-xs text-on-surface-variant">Loading saved addresses from database...</div>
</div>
</main>

<!-- Floating Action Area (Bottom) -->
<div class="fixed bottom-20 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent z-30 pb-safe md:static md:bg-none md:mt-section-gap md:p-0 md:max-w-2xl md:mx-auto">
<button type="button" id="btnOpenAddAddressModal" class="w-full h-[56px] bg-primary text-on-primary rounded-[16px] text-body-md font-body-md font-semibold shadow-level-2 hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
    Add New Address
</button>
</div>

<!-- Add / Edit Address Modal -->
<div id="addressModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
  <div class="bg-surface rounded-t-3xl md:rounded-3xl max-w-md w-full p-6 shadow-2xl border border-outline-variant/30 animate-slide-up">
    <div class="flex items-center justify-between pb-3 border-b border-outline-variant/20 mb-4">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-2xl">pin_drop</span>
        <h3 id="addressModalTitle" class="text-headline-md font-headline-md text-on-surface font-bold">Add New Address</h3>
      </div>
      <button type="button" id="btnCloseAddressModal" class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-variant">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>

    <form id="formAddress" class="space-y-3 text-xs">
      <input type="hidden" id="inputAddressId" value="">
      <div>
        <label class="font-bold text-on-surface block mb-1">Label (e.g. Home, Work, Warehouse)</label>
        <input type="text" id="inputAddressLabel" placeholder="e.g. Home, Office, Branch" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface outline-none focus:ring-1 focus:ring-primary focus:border-primary" required>
      </div>

      <div>
        <label class="font-bold text-on-surface block mb-1">Street Address / Landmark</label>
        <input type="text" id="inputAddressLine" placeholder="123 Elm Street, City, State" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface outline-none focus:ring-1 focus:ring-primary focus:border-primary" required>
      </div>

      <div>
        <label class="font-bold text-on-surface block mb-1">Icon Tag</label>
        <select id="inputAddressTag" class="w-full rounded-xl border border-outline-variant/50 p-2.5 bg-surface text-on-surface font-semibold">
          <option value="home">Home (House icon)</option>
          <option value="work">Work (Building icon)</option>
          <option value="fitness_center">Gym / Fitness</option>
          <option value="local_cafe">Cafe / Hangout</option>
          <option value="store">Warehouse / Shop</option>
        </select>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="inputAddressDefault" class="rounded border-outline-variant text-primary focus:ring-primary">
        <label for="inputAddressDefault" class="text-on-surface font-semibold">Set as primary default address</label>
      </div>

      <div class="pt-3 flex gap-2">
        <button type="button" id="btnCancelAddressModal" class="w-1/2 py-2.5 rounded-xl border border-outline-variant/50 font-bold hover:bg-surface-variant">Cancel</button>
        <button type="submit" id="btnSaveAddressSubmit" class="w-1/2 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md hover:bg-primary-container active:scale-95 transition-all">Save Address</button>
      </div>
    </form>
  </div>
</div>

<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-base pb-safe h-16 bg-surface border-t border-outline-variant/20 rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="local_shipping">local_shipping</span>
<span class="font-label-sm text-label-sm">Deliver</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/tracking">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="distance">distance</span>
<span class="font-label-sm text-label-sm">Tracking</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/history">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]" data-icon="history">history</span>
<span class="font-label-sm text-label-sm">History</span>
</a>
<!-- Active State for Profile -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 group" href="/profile">
<span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px] fill" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>

<!-- Scripts -->
<script defer src="/js/common.js"></script>
<script defer src="/js/saved-addresses.js"></script>
</body></html>
