<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Transitly - Saved Addresses</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/></noscript>

  <!-- Production Compiled Tailwind CSS & Dedicated Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/saved-addresses.css" />
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0 antialiased">

  <!-- TopAppBar (Stitch Spec) -->
  <header class="bg-background text-primary docked full-width top-0 flat no shadows flex justify-between items-center px-container-margin w-full h-16 sticky z-40 border-b border-outline-variant/20">
    <a href="/profile" aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low active:scale-95 transition-transform duration-150 text-on-surface-variant">
      <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
    </a>
    <h1 class="text-headline-md font-headline-md font-bold text-primary absolute left-1/2 transform -translate-x-1/2">
      Saved Addresses
    </h1>
    <div class="w-10 h-10"></div>
  </header>

  <!-- Main Content Canvas (Stitch Spec) -->
  <main class="px-container-margin pt-stack-lg max-w-2xl mx-auto flex flex-col gap-stack-lg">
    <!-- Addresses List -->
    <div class="flex flex-col gap-stack-md">
      <!-- Address Card: Home -->
      <div class="saved-address-card bg-surface-container-lowest rounded-[16px] shadow-level-1 p-4 flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200" data-address="123 Elm Street, Springfield, IL 62701">
        <div class="flex items-center gap-4 flex-1">
          <div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary flex-shrink-0">
            <span class="material-symbols-outlined icon-fill" data-icon="home" data-weight="fill">home</span>
          </div>
          <div class="flex flex-col">
            <span class="text-label-md font-label-md text-on-surface font-semibold">Home</span>
            <span class="text-label-sm font-label-sm text-on-surface-variant mt-1 line-clamp-1">123 Elm Street, Springfield, IL 62701</span>
          </div>
        </div>
        <button aria-label="Edit Home Address" class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:text-primary hover:bg-surface-container transition-colors duration-150 ml-2" onclick="event.stopPropagation(); alert('Edit Home Address')">
          <span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
        </button>
      </div>

      <!-- Address Card: Work -->
      <div class="saved-address-card bg-surface-container-lowest rounded-[16px] shadow-level-1 p-4 flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200" data-address="456 Corporate Blvd, Suite 200, Metropolis, NY 10001">
        <div class="flex items-center gap-4 flex-1">
          <div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant flex-shrink-0">
            <span class="material-symbols-outlined icon-fill" data-icon="work" data-weight="fill">work</span>
          </div>
          <div class="flex flex-col">
            <span class="text-label-md font-label-md text-on-surface font-semibold">Work</span>
            <span class="text-label-sm font-label-sm text-on-surface-variant mt-1 line-clamp-1">456 Corporate Blvd, Suite 200, Metropolis, NY 10001</span>
          </div>
        </div>
        <button aria-label="Edit Work Address" class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:text-primary hover:bg-surface-container transition-colors duration-150 ml-2" onclick="event.stopPropagation(); alert('Edit Work Address')">
          <span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
        </button>
      </div>

      <!-- Address Card: Gym -->
      <div class="saved-address-card bg-surface-container-lowest rounded-[16px] shadow-level-1 p-4 flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200" data-address="789 Muscle Ave, Iron City, CA 90210">
        <div class="flex items-center gap-4 flex-1">
          <div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant flex-shrink-0">
            <span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
          </div>
          <div class="flex flex-col">
            <span class="text-label-md font-label-md text-on-surface font-semibold">Gym</span>
            <span class="text-label-sm font-label-sm text-on-surface-variant mt-1 line-clamp-1">789 Muscle Ave, Iron City, CA 90210</span>
          </div>
        </div>
        <button aria-label="Edit Gym Address" class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:text-primary hover:bg-surface-container transition-colors duration-150 ml-2" onclick="event.stopPropagation(); alert('Edit Gym Address')">
          <span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
        </button>
      </div>

      <!-- Address Card: Favorite Cafe -->
      <div class="saved-address-card bg-surface-container-lowest rounded-[16px] shadow-level-1 p-4 flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors duration-200" data-address="321 Bean Roasters Lane, Seattle, WA 98101">
        <div class="flex items-center gap-4 flex-1">
          <div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant flex-shrink-0">
            <span class="material-symbols-outlined" data-icon="local_cafe">local_cafe</span>
          </div>
          <div class="flex flex-col">
            <span class="text-label-md font-label-md text-on-surface font-semibold">Favorite Cafe</span>
            <span class="text-label-sm font-label-sm text-on-surface-variant mt-1 line-clamp-1">321 Bean Roasters Lane, Seattle, WA 98101</span>
          </div>
        </div>
        <button aria-label="Edit Cafe Address" class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:text-primary hover:bg-surface-container transition-colors duration-150 ml-2" onclick="event.stopPropagation(); alert('Edit Cafe Address')">
          <span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Floating Action Area (Bottom - Stitch Spec) -->
  <div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent z-30 pb-safe md:static md:bg-none md:mt-section-gap md:p-0 md:max-w-2xl md:mx-auto">
    <button class="w-full h-[56px] bg-primary text-on-primary rounded-[16px] text-body-md font-body-md font-semibold shadow-level-2 hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" onclick="alert('Add New Address Modal')">
      <span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
      Add New Address
    </button>
  </div>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>

  <!-- Modular Scripts -->
  <script defer src="/js/common.js"></script>
  <script defer src="/js/saved-addresses.js"></script>
</body>
</html>
