<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Transitly - Saved Addresses</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/></noscript>

  <!-- Production Compiled Tailwind CSS & Dedicated Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/saved-addresses.css" />
</head>
<body class="bg-[#FAF8FF] text-[#191B24] font-sans min-h-screen pt-14 pb-24 antialiased selection:bg-[#DAE1FF] selection:text-[#001849]">

  <!-- TopAppBar (Exact Match to Image) -->
  <header class="fixed top-0 left-0 right-0 w-full z-50 bg-[#FAF8FF] shadow-sm flex items-center px-5 h-14 transition-all border-b border-outline-variant/10">
    <a href="/profile" aria-label="Back" class="hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -ml-2 text-[#191B24]">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <h1 class="text-xl font-bold text-[#0050CB] tracking-tight flex-1 text-center pr-6">Saved Addresses</h1>
  </header>

  <!-- Main Content Canvas (Exact Match to Image) -->
  <main class="w-full max-w-md mx-auto px-5 py-5 flex flex-col gap-3.5">
    <!-- Card 1: Home -->
    <div class="saved-address-card bg-white rounded-[20px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] border border-outline-variant/10 cursor-pointer hover:bg-[#F8FAFC] transition-colors" data-address="123 Elm Street, Springfield, IL 62701">
      <div class="flex items-center gap-3.5 flex-1 min-w-0">
        <div class="w-12 h-12 rounded-full bg-[#DAE1FF] flex items-center justify-center text-[#0050CB] shrink-0">
          <span class="material-symbols-outlined text-[22px] fill">home</span>
        </div>
        <div class="flex flex-col min-w-0 pr-2">
          <span class="text-sm font-bold text-[#191B24]">Home</span>
          <span class="text-xs text-[#5C5F61] truncate mt-0.5">123 Elm Street, Springfield, IL 62701</span>
        </div>
      </div>
      <button aria-label="Edit Home" class="w-9 h-9 flex items-center justify-center rounded-full text-[#5C5F61] hover:text-[#0050CB] hover:bg-gray-100 transition-colors shrink-0" onclick="event.stopPropagation(); alert('Edit Home Address')">
        <span class="material-symbols-outlined text-[20px]">edit</span>
      </button>
    </div>

    <!-- Card 2: Work -->
    <div class="saved-address-card bg-white rounded-[20px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] border border-outline-variant/10 cursor-pointer hover:bg-[#F8FAFC] transition-colors" data-address="456 Corporate Blvd, Suite 200, Metropolis, NY 10001">
      <div class="flex items-center gap-3.5 flex-1 min-w-0">
        <div class="w-12 h-12 rounded-full bg-[#E0E3E5] flex items-center justify-center text-[#191C1E] shrink-0">
          <span class="material-symbols-outlined text-[22px] fill">work</span>
        </div>
        <div class="flex flex-col min-w-0 pr-2">
          <span class="text-sm font-bold text-[#191B24]">Work</span>
          <span class="text-xs text-[#5C5F61] truncate mt-0.5">456 Corporate Blvd, Suite 200,...</span>
        </div>
      </div>
      <button aria-label="Edit Work" class="w-9 h-9 flex items-center justify-center rounded-full text-[#5C5F61] hover:text-[#0050CB] hover:bg-gray-100 transition-colors shrink-0" onclick="event.stopPropagation(); alert('Edit Work Address')">
        <span class="material-symbols-outlined text-[20px]">edit</span>
      </button>
    </div>

    <!-- Card 3: Gym -->
    <div class="saved-address-card bg-white rounded-[20px] p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.02)] border border-outline-variant/10 cursor-pointer hover:bg-[#F8FAFC] transition-colors" data-address="789 Muscle Ave, Iron City, CA 90210">
      <div class="flex items-center gap-3.5 flex-1 min-w-0">
        <div class="w-12 h-12 rounded-full bg-[#E0E3E5] flex items-center justify-center text-[#191C1E] shrink-0">
          <span class="material-symbols-outlined text-[22px]">fitness_center</span>
        </div>
        <div class="flex flex-col min-w-0 pr-2">
          <span class="text-sm font-bold text-[#191B24]">Gym</span>
          <span class="text-xs text-[#5C5F61] truncate mt-0.5">789 Muscle Ave, Iron City, CA 90210</span>
        </div>
      </div>
      <button aria-label="Edit Gym" class="w-9 h-9 flex items-center justify-center rounded-full text-[#5C5F61] hover:text-[#0050CB] hover:bg-gray-100 transition-colors shrink-0" onclick="event.stopPropagation(); alert('Edit Gym Address')">
        <span class="material-symbols-outlined text-[20px]">edit</span>
      </button>
    </div>
  </main>

  <!-- Bottom Floating CTA (Exact Match to Image) -->
  <div class="fixed bottom-0 left-0 right-0 w-full p-5 bg-gradient-to-t from-[#FAF8FF] via-[#FAF8FF] to-transparent z-40 max-w-md mx-auto">
    <button class="w-full h-14 bg-[#0066FF] text-white rounded-[20px] text-base font-bold shadow-lg hover:bg-[#0050CB] active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="alert('Add New Address')">
      <span class="material-symbols-outlined text-[22px]">add</span>
      Add New Address
    </button>
  </div>

  <!-- Modular Scripts -->
  <script defer src="/js/common.js"></script>
  <script defer src="/js/saved-addresses.js"></script>
</body>
</html>
