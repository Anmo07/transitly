<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Proof of Delivery | Transitly</title>
    <meta name="description" content="Transitly Delivery Partner and Driver application for digital proof of delivery and OTP handoff verification.">
    <link rel="canonical" href="https://transitly.in/delivery-partner.html">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Proof of Delivery</h1>
            <p class="text-sm text-gray-500 mt-1">Capture recipient OTP & Signature</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Tracking ID</label>
                <input type="text" id="trackingId" value="TRK-88219" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" />
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Delivery OTP</label>
                <input type="text" id="inputOtp" value="000000" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Recipient Name</label>
                <input type="text" id="recipientName" value="Rohan Verma" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" />
            </div>

            <div class="pt-4">
                <button id="submitBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                    Capture Geofence & Submit PoD
                </button>
            </div>
        </div>

        <div id="result" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const trackingId = document.getElementById('trackingId').value;
            const inputOtp = document.getElementById('inputOtp').value;
            const recipientName = document.getElementById('recipientName').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.classList.remove('hidden', 'text-green-600', 'text-red-600');
            resultDiv.innerText = 'Acquiring GPS location...';
            
            // Mocking geolocation for demonstration
            const payload = {
                trackingId,
                inputOtp,
                recipientName,
                latitude: 28.6315,
                longitude: 77.2167,
                signatureUrl: 'https://s3.amazonaws.com/transitly/sig-demo.png'
            };

            try {
                const response = await fetch('/api/v1/custody/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.classList.add('text-green-600');
                    resultDiv.innerText = 'Success! Proof of Delivery Recorded.';
                } else {
                    resultDiv.classList.add('text-red-600');
                    resultDiv.innerText = 'Error: ' + data.message;
                }
            } catch (err) {
                resultDiv.classList.add('text-red-600');
                resultDiv.innerText = 'Network error.';
            }
        });
    </script>
</body>
</html>
