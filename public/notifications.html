<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Notifications &amp; Alerts — Transitly</title>
  <meta name="description" content="View live fleet alerts, bus departure pings, QR bay seal verifications, and delivery OTP status on Transitly."/>
  <link rel="canonical" href="https://transitly.in/notifications" />
  <meta name="theme-color" content="#0050cb"/>

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://transitly.in/notifications"/>
  <meta property="og:title" content="Notifications &amp; Alerts — Transitly"/>
  <meta property="og:description" content="Real-time transit alerts, highway progress pings, and delivery notifications."/>
  <meta property="og:site_name" content="Transitly"/>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="Notifications &amp; Alerts — Transitly"/>
  <meta name="twitter:description" content="Real-time transit alerts, highway progress pings, and delivery notifications."/>
  
  <!-- Compiled Tailwind CSS & Configuration -->
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0050cb",
            "primary-container": "#0066ff",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffffff",
            "secondary": "#5c5f61",
            "secondary-container": "#e0e3e5",
            "surface": "#faf8ff",
            "surface-variant": "#e1e2ee",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#ecedfa",
            "surface-container-high": "#e6e7f4",
            "on-surface": "#191b24",
            "on-surface-variant": "#424656",
            "outline": "#727687",
            "outline-variant": "#c2c6d8",
            "background": "#faf8ff",
            "on-background": "#191b24",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "emerald-brand": "#128C55"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            "body-md": ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined[data-weight="fill"], .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .animate-pulse-soft {
      animation: pulseSoft 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen pb-24 pt-16 flex flex-col selection:bg-primary-container selection:text-white">

  <!-- Top Navigation App Bar -->
  <header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/30 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center px-4 h-14 w-full">
      <div class="flex items-center gap-3">
        <a href="/" aria-label="Go Back" class="text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all active:scale-95 flex items-center justify-center w-9 h-9 rounded-full">
          <span class="material-symbols-outlined text-2xl">arrow_back</span>
        </a>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold text-on-surface">Notifications</h1>
          <span id="unreadHeaderCountBadge" class="bg-primary text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow-sm">3 New</span>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button type="button" id="btnMarkAllRead" class="text-primary hover:bg-primary/10 text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all flex items-center gap-1 active:scale-95" title="Mark all as read">
          <span class="material-symbols-outlined text-[18px]">done_all</span>
          <span class="hidden sm:inline">Mark all read</span>
        </button>
        <button type="button" id="btnClearAllNotifications" class="text-on-surface-variant hover:text-error hover:bg-error/10 text-xs font-semibold p-1.5 rounded-xl transition-all active:scale-95" title="Clear all">
          <span class="material-symbols-outlined text-[18px]">delete_sweep</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-4xl mx-auto px-4 pt-4 flex-1">

    <!-- Filter Category Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 no-scrollbar text-xs font-semibold">
      <button type="button" class="tab-filter-btn active-tab px-3.5 py-1.5 rounded-full bg-primary text-white shadow-sm shrink-0 transition-all flex items-center gap-1.5" data-category="all">
        <span>All Alerts</span>
        <span id="tabCountAll" class="bg-white/20 text-white px-1.5 py-0.2 rounded-full text-[10px] font-bold">5</span>
      </button>
      <button type="button" class="tab-filter-btn px-3.5 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container shrink-0 transition-all flex items-center gap-1.5" data-category="in_transit">
        <span class="material-symbols-outlined text-[16px] text-primary">local_shipping</span>
        <span>In Transit</span>
        <span id="tabCountTransit" class="bg-primary/10 text-primary px-1.5 py-0.2 rounded-full text-[10px] font-bold">2</span>
      </button>
      <button type="button" class="tab-filter-btn px-3.5 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container shrink-0 transition-all flex items-center gap-1.5" data-category="offers">
        <span class="material-symbols-outlined text-[16px] text-amber-600">local_offer</span>
        <span>Offers & Promos</span>
        <span id="tabCountOffers" class="bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded-full text-[10px] font-bold">2</span>
      </button>
      <button type="button" class="tab-filter-btn px-3.5 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container shrink-0 transition-all flex items-center gap-1.5" data-category="system">
        <span class="material-symbols-outlined text-[16px] text-emerald-600">verified_user</span>
        <span>Security & POD</span>
        <span id="tabCountSystem" class="bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded-full text-[10px] font-bold">1</span>
      </button>
    </div>

    <!-- Search / Filter in Notifications -->
    <div class="relative mb-4">
      <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-on-surface-variant text-lg">search</span>
      <input type="text" id="inputSearchNotifications" placeholder="Filter alerts by tracking ID, bus, or keyword..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-surface-container-low border border-outline-variant/30 text-xs text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
    </div>

    <!-- Notification Cards Feed Container -->
    <div id="notificationsFeedContainer" class="space-y-3">
      <!-- Dynamic Notification Cards Injected by notifications.js -->
    </div>

    <!-- Empty State (Hidden when notifications exist) -->
    <div id="notificationsEmptyState" class="hidden flex-col items-center justify-center py-16 text-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant/60 mb-3">
        <span class="material-symbols-outlined text-3xl">notifications_off</span>
      </div>
      <h3 class="text-base font-bold text-on-surface">No notifications right now</h3>
      <p class="text-xs text-on-surface-variant mt-1 max-w-xs">You're completely up to date! Live transit alerts and special offers will appear here in real-time.</p>
      <a href="/" class="mt-4 px-4 py-2 bg-primary text-white font-bold text-xs rounded-xl shadow-md hover:bg-primary-container transition-all active:scale-95">
        Explore Intercity Corridors
      </a>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 bg-surface border-t border-outline-variant/20 rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
    <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/">
      <span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]">local_shipping</span>
      <span class="text-[11px] font-semibold">Deliver</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/tracking">
      <span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]">distance</span>
      <span class="text-[11px] font-semibold">Tracking</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/history">
      <span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]">history</span>
      <span class="text-[11px] font-semibold">History</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors group rounded-xl" href="/profile">
      <span class="material-symbols-outlined mb-1 group-active:scale-90 transition-transform duration-200 text-[24px]">person</span>
      <span class="text-[11px] font-semibold">Profile</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/js/common.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
