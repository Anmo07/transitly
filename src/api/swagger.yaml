openapi: 3.0.0
info:
  title: Transitly Logistics & Public Transport Parcel Platform API
  description: >
    Enterprise API for intercity public transport cargo capacity monetization,
    distributed Sagas, real-time Redis telemetry, PostGIS spatial tracking,
    last-mile dual feasibility matrix, and WhatsApp parcel assistant.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /bookings:
    post:
      summary: Create Multimodal Shipment Booking (Distributed Saga)
      description: Orchestrates capacity reservation, payment processing, notification dispatch, and child leg scheduling with automatic compensation rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operatorId
                - routeId
                - capacitySlotId
                - sender
                - recipient
                - weightKg
              properties:
                operatorId:
                  type: string
                  example: "64b1f234567890abcdef1234"
                routeId:
                  type: string
                  example: "64b1f234567890abcdef5678"
                capacitySlotId:
                  type: string
                  example: "64b1f234567890abcdef9012"
                sender:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Aarav Sharma"
                    phone:
                      type: string
                      example: "+919876543210"
                    address:
                      type: string
                      example: "Connaught Place, New Delhi"
                recipient:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Rohan Verma"
                    phone:
                      type: string
                      example: "+919876543211"
                    address:
                      type: string
                      example: "Malviya Nagar, Jaipur"
                weightKg:
                  type: number
                  example: 12.5
      responses:
        201:
          description: Booking created successfully.
        400:
          description: Booking rejected or saga compensation triggered.

  /shipments/{trackingId}:
    get:
      summary: Get Shipment Details & Child Legs
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
            example: "TRK-DEL-JAI-9876"
      responses:
        200:
          description: Shipment retrieved with multimodal child legs.
        404:
          description: Shipment not found.

  /lastmile/feasibility:
    post:
      summary: Dual Geolocation Feasibility Matrix Resolver
      description: Evaluates sender pickup and receiver delivery legs independently, determining customer experience (Full D2D, Pickup to Terminal, Terminal to Delivery, Terminal Only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senderAddress:
                  type: object
                  properties:
                    latitude:
                      type: number
                      example: 28.6315
                    longitude:
                      type: number
                      example: 77.2167
                receiverAddress:
                  type: object
                  properties:
                    latitude:
                      type: number
                      example: 26.8530
                    longitude:
                      type: number
                      example: 75.8150
                originTerminal:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "ISBT Kashmere Gate"
                    latitude:
                      type: number
                      example: 28.6675
                    longitude:
                      type: number
                      example: 77.2285
                destinationTerminal:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Sindhi Camp, Jaipur"
                    latitude:
                      type: number
                      example: 26.9124
                    longitude:
                      type: number
                      example: 75.7873
                parcel:
                  type: object
                  properties:
                    weightKg:
                      type: number
                      example: 8.0
      responses:
        200:
          description: Feasibility evaluation matrix and customer messaging.

  /custody/verify-otp:
    post:
      summary: Verify Recipient 6-Digit Delivery OTP
      description: Cryptographic timing-safe OTP verification and Proof of Delivery generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trackingId
                - inputOtp
              properties:
                trackingId:
                  type: string
                  example: "TRK-DEL-JAI-9876"
                inputOtp:
                  type: string
                  example: "492817"
                recipientName:
                  type: string
                  example: "Rohan Verma"
      responses:
        200:
          description: OTP verified and POD created.
        401:
          description: Invalid OTP.

  /tracking/telemetry:
    post:
      summary: Ingest High-Frequency Driver GPS Ping (Fast Path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicleId
                - latitude
                - longitude
              properties:
                vehicleId:
                  type: string
                  example: "DL-01-AB-1234"
                operatorId:
                  type: string
                  example: "DTC-01"
                latitude:
                  type: number
                  example: 28.6320
                longitude:
                  type: number
                  example: 77.2180
                speedKmh:
                  type: number
                  example: 54.0
                heading:
                  type: number
                  example: 180.0
      responses:
        202:
          description: Telemetry accepted in sub-5ms Redis Fast Path.

  /tracking/nearby:
    get:
      summary: Real-Time Proximity Search (GEOSEARCH)
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            example: 28.6320
        - name: lon
          in: query
          required: true
          schema:
            type: number
            example: 77.2180
        - name: radius
          in: query
          schema:
            type: number
            example: 5000
      responses:
        200:
          description: Nearby vehicles with distance and coordinates.

  /whatsapp/webhook:
    post:
      summary: Inbound WhatsApp Customer Message Processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - messageText
              properties:
                from:
                  type: string
                  example: "+919876543210"
                messageText:
                  type: string
                  example: "Where is my parcel TRK-DEL-JAI-9876?"
      responses:
        200:
          description: Automated reply generated with privacy redaction.
