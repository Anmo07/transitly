# ============================================================================
# Transitly — Full Stack Docker Compose Orchestration
# App (Express + Socket.io) + Redis + PostGIS 16 (ARM64 / Apple Silicon Native)
# ============================================================================

services:
  # ---- Transitly Express Core Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transitly-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - transitly-net

  # ---- Database Initializer (Run-Once Schema & Seed Job) ----
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transitly-db-init
    env_file:
      - .env.docker
    depends_on:
      postgis:
        condition: service_healthy
    command: ["node", "src/db/initDb.js"]
    restart: "no"
    networks:
      - transitly-net

  # ---- Fast Path In-Memory Datastore & Stream Buffer ----
  redis:
    image: redis:7-alpine
    container_name: transitly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - transitly-net

  # ---- Spatial Telemetry & Transaction Datastore (PostGIS 16 / PostgreSQL) ----
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: transitly-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: transitly_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5433:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transitly_telemetry"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - transitly-net

volumes:
  redis_data:
    driver: local
  postgis_data:
    driver: local

networks:
  transitly-net:
    driver: bridge
