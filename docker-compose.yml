services:
  # Fast Path In-Memory Datastore & Stream Buffer (ARM64 Native)
  redis:
    image: redis:7-alpine
    container_name: transitly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Slow Path Spatial Telemetry Datastore (ARM64 Native for Apple Silicon M2)
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: transitly-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: transitly_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5433:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d

  # Document Datastore for Aggregate Transactions (ARM64 Native)
  mongodb:
    image: mongo:7.0
    container_name: transitly-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  postgis_data:
  mongo_data:
